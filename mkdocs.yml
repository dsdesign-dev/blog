site_name: Distributed Systems Design
site_url: https://dsdesign.dev
site_description: Distributed Systems & SRE insights by a Professional SRE Engineer
site_author: Saeeda

repo_url: https://github.com/dsdesign-dev/blog
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"
      archive: true
      categories: true
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
  - social:
      cards_layout: default
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/saeedabbassi
    - icon: fontawesome/brands/github
      link: https://github.com/dsdesign-dev

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
